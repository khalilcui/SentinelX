version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinelx
      POSTGRES_PASSWORD: sentinelx
      POSTGRES_DB: sentinelx
    volumes:
      - sentinelx_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg2://sentinelx:sentinelx@db:5432/sentinelx
      SECRET_KEY: change-this-to-a-long-random-string-in-production
      CORS_ORIGINS: http://localhost:5173,http://localhost:4173,http://localhost:3000,http://localhost:8080
    ports:
      - "8000:8000"
    volumes:
      - sentinelx_reports:/app/generated_reports

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  sentinelx_pgdata:
  sentinelx_reports:
